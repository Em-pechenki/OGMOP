name: PR Preview

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Build PR preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /OGMOP/pr-${{ github.event.pull_request.number }}/
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "### PR Preview build",
              "",
              "Preview artifact `pr-preview-${{ github.event.pull_request.number }}` is available in the workflow run artifacts.",
              "Download it from the **Actions** tab and serve with `npx serve dist`.",
              "",
              "_Base path: `/OGMOP/pr-${{ github.event.pull_request.number }}/`_"
            ].join("\\n");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });