name: Monitor GitHub Pages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Pages availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTP status
        run: |
          URL="https://Em-pechenki.github.io/OGMOP/"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Pages not available (HTTP $code)"
          exit 1