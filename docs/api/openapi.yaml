openapi: 3.0.3
info:
  title: OGMOP API
  version: 1.1.0
  description: |
    Backend API for OGMOP — AI Security Workflow platform.
    Единый формат ответов: `{ "data": <T>, "error": null }` при успехе,
    `{ "data": null, "error": "<message>", "details"?: <any> }` при ошибке.
    In-memory store сбрасывается при рестарте процесса.
servers:
  - url: http://localhost:3001
    description: Локальный бэкенд (PORT переопределяет порт)
tags:
  - name: Health
  - name: Workflows
  - name: Runs
  - name: Templates
  - name: Generate
  - name: CI
  - name: Engine
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHealth"
  /api/workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      operationId: listWorkflows
      responses:
        "200":
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWorkflowList"
    post:
      tags: [Workflows]
      summary: Create workflow
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWorkflow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
  /api/workflows/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Workflows]
      summary: Get workflow by id
      operationId: getWorkflow
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWorkflow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
    put:
      tags: [Workflows]
      summary: Update workflow (full)
      operationId: updateWorkflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWorkflow"
        "404":
          description: Not found
    patch:
      tags: [Workflows]
      summary: Update workflow (partial)
      operationId: patchWorkflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWorkflow"
        "404":
          description: Not found
    delete:
      tags: [Workflows]
      summary: Delete workflow
      operationId: deleteWorkflow
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeleted"
        "404":
          description: Not found
  /api/workflows/{id}/run:
    post:
      tags: [Runs, Engine]
      summary: Run workflow (start engine execution)
      operationId: runWorkflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRun"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRunStart"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
  /api/runs:
    get:
      tags: [Runs]
      summary: List runs
      operationId: listRuns
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRunList"
  /api/runs/{id}:
    get:
      tags: [Runs]
      summary: Get run status and results
      operationId: getRun
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
  /api/templates:
    get:
      tags: [Templates]
      summary: List templates
      operationId: listTemplates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTemplateList"
    post:
      tags: [Templates]
      summary: Create template
      operationId: createTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTemplate"
        "400":
          description: Validation error
  /api/templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Templates]
      summary: Get template
      operationId: getTemplate
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTemplate"
        "404":
          description: Not found
    delete:
      tags: [Templates]
      summary: Delete template
      operationId: deleteTemplate
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeleted"
        "404":
          description: Not found
  /api/generate:
    post:
      tags: [Generate]
      summary: Generate a workflow scenario from a prompt
      operationId: generateWorkflow
      description: |
        Aliases: `/api/generate/generate`, `/api/generate/scenario`.
        Deterministic generator (mock) returns a valid workflow graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
  /api/ci:
    post:
      tags: [CI]
      summary: Trigger a workflow run from CI/CD
      operationId: runCi
      description: |
        Aliases: `/api/ci/run`, `/api/ci/runs`, `/api/ci/ci`, `/api/ci/ci/run`, `/api/ci/ci/runs`.
        Accepts `workflowId`, `workflow_id` or `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiRunRequest"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCiRun"
        "400":
          description: Validation error
        "404":
          description: Workflow not found
  /api/ci/run:
    post:
      tags: [CI]
      summary: Trigger a workflow run from CI/CD (alias)
      operationId: runCiAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiRunRequest"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCiRun"
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        data:
          nullable: true
        error:
          type: string
          nullable: true
    ApiResponseError:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
    ApiResponseHealth:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
      description: "data = { status, project, uptime, timestamp }"
    ApiResponseDeleted:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
      description: "data = { deleted: true }"
    ApiResponseRunStart:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
      description: "data = { runId }"
    ApiResponseWorkflow:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
    ApiResponseWorkflowList:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
    ApiResponseRun:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
    ApiResponseRunList:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
      description: "data = Run[]"
    ApiResponseTemplate:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
    ApiResponseTemplateList:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
    Health:
      type: object
      properties:
        status:
          type: string
        project:
          type: string
        uptime:
          type: number
        timestamp:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    Severity:
      type: string
      enum: [critical, high, medium, low, info]
    RunStatus:
      type: string
      enum: [queued, running, success, failed, cancelled]
      description: Статус запуска (backend in-memory store)
    NodeRunStatus:
      type: string
      enum: [idle, running, success, error, skipped]
    NodeType:
      type: string
      enum:
        - trigger.manual
        - trigger.schedule
        - logic.if
        - logic.compare
        - logic.regex
        - notify.telegram
        - notify.smtp
        - notify.webhook
        - scanner.secrets
        - scanner.sca
        - scanner.sast
        - ai.analyze
    Node:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/NodeType"
        position:
          $ref: "#/components/schemas/Position"
        data:
          type: object
          description: Данные ноды (дискриминированный union по полю kind). См. docs/nodes.md.
        selected:
          type: boolean
        draggable:
          type: boolean
        width:
          type: number
        height:
          type: number
    Edge:
      type: object
      required: [source, target]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        sourceHandle:
          type: string
          nullable: true
        targetHandle:
          type: string
          nullable: true
        label:
          type: string
        condition:
          type: string
          description: "'true' | 'false' | произвольная метка для ветвления"
        animated:
          type: boolean
        style:
          type: object
    Workflow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        templateId:
          type: string
        metadata:
          type: object
    WorkflowCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
    WorkflowUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
    WorkflowRun:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
          description: Входные данные для запуска workflow
    Run:
      type: object
      description: Статус выполнения workflow (backend in-memory)
      properties:
        id:
          type: string
        workflowId:
          type: string
        status:
          type: string
          enum: [queued, running, success, failed, cancelled]
        nodeStatuses:
          type: object
          additionalProperties:
            type: string
            enum: [idle, running, success, error, skipped]
        nodeResults:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NodeResult"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        aiReport:
          $ref: "#/components/schemas/AiReport"
          nullable: true
    NodeResult:
      type: object
      properties:
        nodeId:
          type: string
        status:
          $ref: "#/components/schemas/NodeRunStatus"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: number
        output:
          description: Выход ноды (зависит от типа)
        error:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        logs:
          type: array
          items:
            type: string
    Finding:
      type: object
      required: [id, severity, title]
      properties:
        id:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        description:
          type: string
        file:
          type: string
        line:
          type: integer
        column:
          type: integer
        ruleId:
          type: string
        scanner:
          type: string
          enum: [secrets, sca, sast]
        cve:
          type: string
        packageName:
          type: string
        package:
          type: string
        version:
          type: string
        fixedVersion:
          type: string
        recommendation:
          type: string
        snippet:
          type: string
    AiReport:
      type: object
      required: [summary, recommendations]
      properties:
        summary:
          type: string
        riskLevel:
          $ref: "#/components/schemas/Severity"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        recommendations:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        workflow:
          $ref: "#/components/schemas/Workflow"
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isPublic:
          type: boolean
    TemplateCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        workflow:
          $ref: "#/components/schemas/Workflow"
    ScanConfig:
      type: object
      required: [scannerType]
      properties:
        scannerType:
          type: string
          enum: [secrets, sca, sast]
        targetPath:
          type: string
        repoUrl:
          type: string
        includePatterns:
          type: array
          items:
            type: string
        excludePatterns:
          type: array
          items:
            type: string
        options:
          type: object
          additionalProperties: true
    NotifyConfig:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [telegram, smtp, webhook]
        botToken:
          type: string
        chatId:
          type: string
        host:
          type: string
        port:
          type: integer
        secure:
          type: boolean
        user:
          type: string
        password:
          type: string
        from:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        url:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH]
        headers:
          type: object
          additionalProperties:
            type: string
        bodyTemplate:
          type: string
    GenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 2000
        name:
          type: string
          maxLength: 200
        stack:
          type: string
        scanners:
          type: array
          items:
            type: string
        notify:
          type: string
        notification:
          type: string
        aiReport:
          type: boolean
        targetPath:
          type: string
        webhookUrl:
          type: string
    GenerateResponse:
      type: object
      properties:
        name:
          type: string
        stack:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        warnings:
          type: array
          items:
            type: string
    CiRunRequest:
      type: object
      properties:
        workflowId:
          type: string
        workflow_id:
          type: string
        id:
          type: string
        branch:
          type: string
        repo:
          type: string
        input:
          type: object
          additionalProperties: true
    ApiResponseCiRun:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
      description: "data = { runId, source }"
    AiGenerationRequest:
      type: object
      description: Shared/frontend AI generation request (src/shared)
      properties:
        prompt:
          type: string
          minLength: 10
          maxLength: 2000
        language:
          type: string
          enum: [kotlin-spring, node, python, go, generic]
        scanners:
          type: array
          items:
            type: string
            enum: [secrets, sca, sast]
        notifyChannel:
          type: string
          enum: [none, telegram, webhook, email]
        aiEnabled:
          type: boolean
        baseWorkflowName:
          type: string
        maxNodes:
          type: integer
    CiCdConfig:
      type: object
      description: Shared/frontend CI/CD configuration (src/shared)
      properties:
        provider:
          type: string
          enum: [github]
        repository:
          type: string
        branches:
          type: array
          items:
            type: string
        triggers:
          type: array
          items:
            type: string
            enum: [push, pull_request, schedule]
        workflowId:
          type: string
        severityThreshold:
          $ref: "#/components/schemas/Severity"
        commentOnPr:
          type: boolean
        status:
          type: string
          enum: [disconnected, connecting, connected, error]