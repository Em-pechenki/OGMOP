# Example CI/CD workflow for consumers of OGMOP
# Copy this file to your repository as .github/workflows/ogmop-ci.yml
name: OGMOP CI/CD (example)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Reuse OGMOP's reusable workflow (optional):
  # ogmop:
  #   uses: Em-pechenki/OGMOP/.github/workflows/reusable-ci.yml@main
  #   with:
  #     node-version: "20"
  #     run-lighthouse: true
